# Ecom — local development database (dev only; not a production deployment).
# Docker is pinned here for local parity with the PostgreSQL 18.6 baseline.
# `docker compose up -d postgres` brings up the dev database; NO business tables
# exist in Story 1.1 — the Prisma baseline migration is intentionally empty.
services:
  postgres:
    image: postgres:18.6
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom
    ports:
      - '5432:5432'
    volumes:
      - ecom_pgdata:/var/lib/postgresql/data

volumes:
  ecom_pgdata:
